services:
  - type: web
    name: samamarket-api
    runtime: python
    rootDir: Marketplace
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn Marketplace.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: samamarket.onrender.com,samamarket-api.onrender.com,samamarket-6afq.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: samamarket-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://samamarket-6afq.onrender.com,https://samamarket.onrender.com,http://localhost:4200
      - key: CSRF_TRUSTED_ORIGINS
        value: https://samamarket-6afq.onrender.com,https://samamarket.onrender.com,http://localhost:4200

databases:
  - name: samamarket-db
    databaseName: samamarket
    user: samamarket