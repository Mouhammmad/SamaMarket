<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <title>{% block title %}Mon site Django{% endblock %}</title>

   <style>
       body { margin: 0; font-family: Arial; }

       header {
           background: #0B1F3A;
           color: white;
           padding: 15px;
           text-align: center;
       }

       nav {
           background: #6C63FF;
           padding: 10px;
           text-align: center;
       }

       nav a {
           color: white;
           margin: 0 15px;
           text-decoration: none;
           font-weight: bold;
       }

       nav a:hover {
           text-decoration: underline;
       }

       .content {
           padding: 40px;
           min-height: 60vh;
           text-align: center;
       }

       footer {
           background: #0B1F3A;
           color: white;
           text-align: center;
           padding: 15px;
       }
   </style>
</head>

<body>

<header>
   <h1>🚀 Mon site Django</h1>
</header>

<nav>
   <a href="/">Accueil</a>
   <a href="/about/">À propos</a>
   <a href="/contact/">Contact</a>
</nav>

<div class="content">
   {% block content %}
   {% endblock %}
</div>

<footer>
   © 2026 - Mon site Django
</footer>

</body>
</html>
